[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sched"
version = "0.1.0"
description = "sched — node-level GPU/CPU batch scheduler: one-job-per-GPU, batch semantics, artifact fingerprinting, co-location packing, multi-project quotas"
keywords = ["gpu", "scheduler", "hpc", "slurm", "batch-scheduling", "deep-learning", "mlops"]
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
sched = "gsched.cli:main"

[tool.setuptools.packages.find]
include = ["gsched", "gsched.*"]
