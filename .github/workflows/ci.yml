name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Check scanner against synthetic Git repositories
        run: python -m unittest discover -s scripts -p test_repository_check.py -v
      - name: Check execution boundary scanner
        run: python -m unittest discover -s scripts -p test_execution_boundary.py -v
      - name: Check candidate integrity and CI admission
        run: python -m unittest discover -s scripts -p test_release_candidate.py -v
      - name: Check release preparation and interrupted draft uploads
        run: python -m unittest discover -s scripts -p test_prepare_release.py -v
      - name: Check runtime and required-test independence
        run: python scripts/check_execution_boundary.py
      - name: Check privacy, Markdown references and commit whitespace
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$DIFF_BASE" || "$DIFF_BASE" =~ ^0+$ ]]; then
            DIFF_BASE=$(git rev-parse HEAD^ 2>/dev/null || true)
          fi
          if [[ -n "$DIFF_BASE" ]]; then
            python scripts/check_repository.py --all --base "$DIFF_BASE"
          else
            python scripts/check_repository.py --all
          fi

  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[test]'
      - name: Public Linux regression suite
        run: python -m pytest -q -rs tests
      - name: Independent default wheel installation without a compiler
        run: |
          python -m pip install 'setuptools>=61' wheel
          python tests/run_install_accept.py
      - name: CPU acceptance and CLI contracts
        if: matrix.python == '3.10'
        run: |
          python tests/run_execution_accept.py
          python tests/run_host_resources_accept.py
          bash tests/run_mode_consistency_accept.sh
          bash tests/run_project_gpu_enabled_accept.sh
          bash tests/run_docs_refs_accept.sh

  native:
    name: Native Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
        os: [ubuntu-22.04, ubuntu-24.04]
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      SCHED_BUILD_NATIVE: "1"
      SCHED_REQUIRE_NATIVE: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Build native from this repository
        run: python -m pip install -e '.[test]'
      - name: Require native backend availability
        run: python -c 'from gsched.execution import LinuxFdBackend; LinuxFdBackend()'
      - name: Independent native and subsequent default wheel installations
        run: |
          python -m pip install 'setuptools>=61' wheel
          python tests/run_install_accept.py --native
      - name: Independent native and scheduler regression suite
        run: python -m pytest -q -rs tests
      - name: Real syscall denial capability checks
        run: python tests/run_capability_denial_accept.py
      - name: Public execution CLI lifecycle
        run: python tests/run_execution_accept.py

  candidate:
    name: Candidate Python ${{ matrix.python }} / ${{ matrix.os }}
    needs: [repository, python, native]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install development build tools
        run: python -m pip install pip==26.2.1 setuptools==84.0.0 wheel==0.48.0 packaging==26.3
      - name: Build and verify candidates from the validated commit
        id: build
        env:
          SCHED_CI_VALIDATED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SCHED_CI_RESULTS: ${{ toJSON(needs) }}
          SCHED_CI_BUILD_TARGET: ${{ matrix.os }}
        run: |
          python scripts/build_release_candidate.py --commit "$SCHED_CI_VALIDATED_SHA" --native
          python scripts/verify_release_candidate.py "dist/candidate-${SCHED_CI_VALIDATED_SHA:0:7}" --commit "$SCHED_CI_VALIDATED_SHA" --require-ci
          python - <<'PY'
          import hashlib, os
          from pathlib import Path
          commit = os.environ['SCHED_CI_VALIDATED_SHA']
          directory = Path('dist') / ('candidate-' + commit[:7])
          digest = hashlib.sha256((directory / 'manifest.json').read_bytes()).hexdigest()
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'commit={commit}\ndirectory={directory}\nmanifest_sha256={digest}\n')
          PY
      - name: Save immutable candidate packet
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sched-candidate-${{ steps.build.outputs.commit }}-python-${{ matrix.python }}-${{ matrix.os }}-attempt-${{ github.run_attempt }}
          path: ${{ steps.build.outputs.directory }}/
          if-no-files-found: error
          retention-days: 30
          overwrite: false
      - name: Record artifact provenance
        env:
          SOURCE_COMMIT: ${{ steps.build.outputs.commit }}
          MANIFEST_SHA256: ${{ steps.build.outputs.manifest_sha256 }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          ARTIFACT_SHA256: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          python - <<'PY'
          import os
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('Candidate only; no tag, release or deployment was created.\n\n')
              for key in ('SOURCE_COMMIT', 'MANIFEST_SHA256', 'ARTIFACT_ID', 'ARTIFACT_URL', 'ARTIFACT_SHA256'):
                  summary.write(f"- {key}: `{os.environ[key]}`\n")
          PY
