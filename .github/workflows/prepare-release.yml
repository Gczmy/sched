name: Prepare release draft

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Reviewed full main commit whose CI completed successfully
        required: true
        type: string
      ci_run_id:
        description: Successful main push CI run ID
        required: true
        type: string
      version:
        description: Numeric package version matching the reviewed source
        required: true
        type: string
        default: '0.3.1'
      upload_draft:
        description: Upload a matching draft after verification; never publish
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sched-release-preparation
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      REVIEWED_COMMIT: ${{ inputs.commit }}
      CI_RUN_ID: ${{ inputs.ci_run_id }}
      RELEASE_VERSION: ${{ inputs.version }}
      UPLOAD_DRAFT: ${{ inputs.upload_draft }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Verify reviewed main and prepare immutable assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$REVIEWED_COMMIT"
          options=()
          if [[ "$UPLOAD_DRAFT" == true ]]; then
            options+=(--upload-draft)
          fi
          python scripts/prepare_release.py --repository "$GITHUB_REPOSITORY" \
            --commit "$REVIEWED_COMMIT" --run-id "$CI_RUN_ID" --version "$RELEASE_VERSION" \
            --output dist/release-prepared "${options[@]}"
      - name: Save verified release preparation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sched-release-prepared-${{ inputs.commit }}-${{ github.run_id }}
          path: dist/release-prepared/
          if-no-files-found: error
          overwrite: false
          retention-days: 30
